version: '3.9'
services:
  mongodb:
    image: mongo:7
    container_name: upos_mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: upos
      MONGO_INITDB_ROOT_PASSWORD: upos_secret
      MONGO_INITDB_DATABASE: upos
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
